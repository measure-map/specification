name: Release

# Pushing a tag v<version> publishes all released schema versions to GitHub Pages and creates
# a GitHub Release. Running the workflow manually republishes the Pages site only.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that the tag matches the schema $ids and the changelog
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          for file in measure.schema.json measuremap.schema.json; do
            grep -qF "\"\$id\": \"https://measure-map.github.io/specification/schema/$version/$file\"" "$file" \
              || { echo "::error file=$file::\$id does not name version $version"; exit 1; }
          done
          grep -q "^## \[$version\]" CHANGELOG.md \
            || { echo "::error file=CHANGELOG.md::no entry for $version"; exit 1; }

      - name: Build the site from all release tags
        run: |
          mkdir -p site/schema
          touch site/.nojekyll
          latest=""
          items=""
          for tag in $(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=v:refname); do
            version="${tag#v}"
            mkdir -p "site/schema/$version"
            for file in measure.schema.json measuremap.schema.json; do
              git show "$tag:$file" > "site/schema/$version/$file"
            done
            latest="$version"
            items="<li><a href=\"schema/$version/measuremap.schema.json\">$version</a></li>$items"
          done
          [ -n "$latest" ] || { echo "::error::no release tags found"; exit 1; }
          cp -r "site/schema/$latest" site/schema/latest
          cat > site/index.html <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <title>MeasureMap schemas</title>
          <h1>MeasureMap schemas</h1>
          <p>Specification: <a href="https://github.com/measure-map/specification">measure-map/specification</a>.
          Latest release: <a href="schema/latest/measuremap.schema.json">$latest</a>.</p>
          <ul>$items</ul>
          HTML

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Create the GitHub Release from the changelog entry
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { p = index($0, "## [" v "]") == 1; next }
            /^\[[^]]+\]: / { p = 0 }
            p
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
